  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" fill="#faf7f2"/>
  <text x="40" y="42" fill="#57534e" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ERROR HANDLING · SOURCE-SCOPED</text>
  <text x="40" y="72" fill="#1c1917" font-size="19" font-weight="600" font-family="'Geist', sans-serif">工具阶段有局部捕获；Agent Loop 仍可能失败</text>
  <rect x="40" y="100" width="425" height="350" rx="8" fill="#ffffff" stroke="#2d6e3c" stroke-width="1.2"/>
  <rect x="40" y="100" width="425" height="42" rx="8" fill="rgba(45,110,60,0.08)"/>
  <text x="62" y="127" fill="#2d6e3c" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">工具阶段：捕获后形成错误结果</text>
  <text x="62" y="172" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">prepareToolCall</text>
  <text x="62" y="193" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">未知工具、参数准备/校验、beforeToolCall 失败</text>
  <line x1="62" y1="208" x2="442" y2="208" stroke="rgba(28,25,23,0.12)"/>
  <text x="62" y="236" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">executePreparedToolCall</text>
  <text x="62" y="257" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">tool.execute(); 更新事件拒绝仍可能向上抛</text>
  <line x1="62" y1="272" x2="442" y2="272" stroke="rgba(28,25,23,0.12)"/>
  <text x="62" y="300" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">finalizeExecutedToolCall</text>
  <text x="62" y="321" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">afterToolCall 失败</text>
  <rect x="62" y="352" width="380" height="66" rx="5" fill="rgba(45,110,60,0.06)" stroke="rgba(45,110,60,0.30)"/>
  <text x="252" y="378" fill="#2d6e3c" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">isError: true · ToolResultMessage</text>
  <text x="252" y="400" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">仅表示上列工具阶段的局部捕获结果</text>

  <rect x="495" y="100" width="425" height="350" rx="8" fill="#ffffff" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="495" y="100" width="425" height="42" rx="8" fill="rgba(181,82,58,0.08)"/>
  <text x="517" y="127" fill="#b5523a" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">Loop 运行路径：不在上述局部 catch 内</text>
  <text x="517" y="172" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">等待事件监听器</text>
  <text x="517" y="193" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">tool_execution_start/end、结果 message_start/end</text>
  <line x1="517" y1="208" x2="897" y2="208" stroke="rgba(28,25,23,0.12)"/>
  <text x="517" y="236" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">prepareNextTurn / transformContext 等回调</text>
  <text x="517" y="257" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">拒绝时可能使低层循环失败</text>
  <line x1="517" y1="272" x2="897" y2="272" stroke="rgba(28,25,23,0.12)"/>
  <text x="517" y="300" fill="#1c1917" font-size="11" font-weight="600" font-family="'Geist', sans-serif">pi-agent-core Agent 生命周期包装</text>
  <text x="517" y="321" fill="#57534e" font-size="10" font-family="'Geist', sans-serif">会尝试报告 assistant error；报告监听器也可能失败</text>
  <rect x="517" y="352" width="380" height="66" rx="5" fill="rgba(181,82,58,0.06)" stroke="rgba(181,82,58,0.30)"/>
  <text x="707" y="378" fill="#b5523a" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">异常可能向上抛出</text>
  <text x="707" y="400" fill="#57534e" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">不一定成为 ToolResultMessage</text>

  <line x1="40" y1="482" x2="920" y2="482" stroke="rgba(28,25,23,0.12)"/>
  <text x="40" y="510" fill="#b5523a" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BOUNDARY</text>
  <text x="132" y="510" fill="#1c1917" font-size="11" font-family="'Geist', sans-serif">这是按源码划定的局部捕获范围，不是“所有异常都被吞掉”的全局保证。</text>
</svg>
