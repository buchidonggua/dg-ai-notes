<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>260702-ch03-stopreason-flowchart</title>
  <style>html,body{margin:0;background:#f5f5f4}body{display:grid;place-items:center;min-height:100vh}svg{width:min(100%,1200px);height:auto;background:white}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop stopReason 决策流程</title>
  <desc id="desc">错误与取消直接结束；其他状态检查工具调用内容。length 工具调用生成失败结果后继续模型请求；正常工具调用进入执行，之后检查队列和收尾钩子。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#57534e"/></marker>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b5523a"/></marker>
    <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1c1917}.label{font-size:14px}.small{font-size:12px}.tiny{font-size:11px}.node{fill:#fafaf9;stroke:#57534e;stroke-width:1.4}.decision{fill:#f5f5f4;stroke:#57534e;stroke-width:1.4}.red{fill:#fff7f5;stroke:#b5523a;stroke-width:1.4}.green{fill:#f6fbf6;stroke:#2d6e3c;stroke-width:1.4}</style>
  </defs>
  <rect width="960" height="610" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="21" font-weight="700">Agent Loop：先看 stopReason，再看消息内容</text>
  <rect class="node" x="350" y="54" width="260" height="46" rx="10"/><text class="label" x="480" y="82" text-anchor="middle">收到 AssistantMessage</text>
  <path d="M480 100v28" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <polygon class="decision" points="480,130 590,175 480,220 370,175"/><text class="label" x="480" y="171" text-anchor="middle">stopReason 是</text><text class="label" x="480" y="190" text-anchor="middle">error / aborted？</text>
  <path d="M370 175H180v48" fill="none" stroke="#b5523a" stroke-width="1.4" marker-end="url(#redArrow)"/><text class="small" x="260" y="165" fill="#b5523a">是</text>
  <rect class="red" x="60" y="225" width="240" height="65" rx="10"/><text class="label" x="180" y="252" text-anchor="middle">发 turn_end + agent_end</text><text class="small" x="180" y="273" text-anchor="middle">低层 run 直接结束；无自动 retry</text>
  <path d="M480 220v33" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/><text class="small" x="493" y="242">否</text>
  <polygon class="decision" points="480,255 590,300 480,345 370,300"/><text class="label" x="480" y="296" text-anchor="middle">消息内容有</text><text class="label" x="480" y="315" text-anchor="middle">toolCall 块？</text>
  <path d="M590 300H830v32" fill="none" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/><text class="small" x="635" y="289">有</text>
  <polygon class="decision" points="830,335 900,372 830,409 760,372"/><text class="small" x="830" y="369" text-anchor="middle">length？</text><text class="tiny" x="830" y="386" text-anchor="middle">含 toolCall</text>
  <path d="M760 372h-90v43" fill="none" stroke="#b5523a" stroke-width="1.4" marker-end="url(#redArrow)"/><text class="tiny" x="700" y="361">是</text>
  <rect class="red" x="560" y="418" width="220" height="68" rx="10"/><text class="label" x="670" y="445" text-anchor="middle">逐个生成失败 ToolResult</text><text class="small" x="670" y="466" text-anchor="middle">不执行截断参数；供模型后续纠正</text>
  <path d="M830 409V555H623" fill="none" stroke="#2d6e3c" stroke-width="1.4" marker-end="url(#arrow)"/><text class="tiny" x="842" y="438">否：执行工具批次</text>
  <path d="M670 486v44h-90" fill="none" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect class="green" x="350" y="530" width="270" height="50" rx="10"/><text class="label" x="485" y="552" text-anchor="middle">追加工具结果，检查下一轮条件</text><text class="tiny" x="485" y="570" text-anchor="middle">批次 terminate 等条件另行决定是否续跑</text>
  <path d="M370 300H190v147" fill="none" stroke="#57534e" stroke-width="1.4" marker-end="url(#arrow)"/><text class="small" x="255" y="318">无</text>
  <rect class="node" x="60" y="450" width="260" height="80" rx="10"/><text class="label" x="190" y="478" text-anchor="middle">检查队列与收尾条件</text><text class="small" x="190" y="500" text-anchor="middle">steering / follow-up / stop hook</text><text class="tiny" x="190" y="518" text-anchor="middle">队列可开启后续 Turn</text>
  <text class="tiny" x="480" y="600" text-anchor="middle" fill="#78716c">pending / deferred 是 StopReason 联合类型成员；核心 Loop 不为它们实现自动等待或恢复。</text>
</svg>
</body>
</html>
