<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Agent、Session 与扩展事件桥接</title>
  <desc id="desc">AgentEvent 先更新 Agent 状态并等待 Agent listeners；AgentSession 桥接时先等待扩展事件投影，再同步调用 Session listeners。Session 与 SDK 还直接产生各自专属事件。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#57534e"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b5523a"/></marker><marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2d6e3c"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1c1917}.title{font-size:20px;font-weight:700}.head{font-size:14px;font-weight:700}.body{font-size:12px}.small{font-size:11px}.box{fill:#fafaf9;stroke:#57534e;stroke-width:1.3}.core{fill:#fff7f5;stroke:#b5523a;stroke-width:1.4}.session{fill:#eff6ff;stroke:#3973ac;stroke-width:1.3}.ext{fill:#f6fbf6;stroke:#2d6e3c;stroke-width:1.3}.caption{fill:#78716c;font-size:11px}</style></defs>
  <rect width="1000" height="570" fill="#fff"/><text class="title" x="500" y="32" text-anchor="middle">三种事件类型：一条桥接链与多个直接生产点</text>
  <rect class="core" x="35" y="75" width="200" height="115" rx="12"/><text class="head" x="135" y="104" text-anchor="middle">Agent 内核</text><text class="body" x="135" y="132" text-anchor="middle">AgentEvent</text><text class="small" x="135" y="154" text-anchor="middle">processEvents 更新状态</text><text class="small" x="135" y="173" text-anchor="middle">顺序 await Agent listeners</text>
  <path d="M235 132h75" stroke="#57534e" stroke-width="1.5" marker-end="url(#arrow)"/><rect class="session" x="315" y="75" width="240" height="115" rx="12"/><text class="head" x="435" y="104" text-anchor="middle">AgentSession bridge</text><text class="body" x="435" y="132" text-anchor="middle">_handleAgentEvent()</text><text class="small" x="435" y="154" text-anchor="middle">先 await 扩展投影</text><text class="small" x="435" y="173" text-anchor="middle">之后同步 _emit()</text>
  <path d="M555 112h80v-2h30" fill="none" stroke="#2d6e3c" stroke-width="1.5" marker-end="url(#greenArrow)"/><rect class="ext" x="670" y="65" width="285" height="140" rx="12"/><text class="head" x="812" y="94" text-anchor="middle">ExtensionEvent / pi.on</text><text class="small" x="812" y="120" text-anchor="middle">部分 AgentEvent 的投影</text><text class="small" x="812" y="142" text-anchor="middle">Runner 逐方法等待 handler</text><text class="small" x="812" y="164" text-anchor="middle">返回值、异常规则各不相同</text><text class="small" x="812" y="186" text-anchor="middle">tool_call 异常转为错误 ToolResult</text>
  <path d="M555 160H605V298H665" fill="none" stroke="#3973ac" stroke-width="1.5" marker-end="url(#arrow)"/><rect class="session" x="670" y="235" width="285" height="125" rx="12"/><text class="head" x="812" y="264" text-anchor="middle">AgentSessionEvent</text><text class="small" x="812" y="290" text-anchor="middle">内核事件 + agent_end.willRetry</text><text class="small" x="812" y="312" text-anchor="middle">+ Session 产生的队列、压缩、</text><text class="small" x="812" y="332" text-anchor="middle">重试与元信息事件</text>

  <rect class="box" x="670" y="400" width="285" height="105" rx="12"/><text class="head" x="812" y="429" text-anchor="middle">SDK / 其他 ExtensionEvent 生产点</text><text class="small" x="812" y="455" text-anchor="middle">input · context · Provider · UI · Resource</text><text class="small" x="812" y="478" text-anchor="middle">直接调用 ExtensionRunner，不走 _emit()</text><path d="M955 452H980V135H957" fill="none" stroke="#2d6e3c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#greenArrow)"/>
  <rect x="35" y="245" width="510" height="175" rx="12" fill="#f5f5f4" stroke="#d6d3d1"/><text class="head" x="55" y="274">读取不同入口时记住这条规则</text><text class="body" x="60" y="306">session.subscribe：同步调用回调，不读返回值，不 await Promise。</text><text class="body" x="60" y="338">pi.on：由具体 Runner 方法 await；是否读取结果和捕获异常逐方法而定。</text><text class="body" x="60" y="370">普通内核事件经过 bridge 时，扩展派发先于 Session listener。</text><text class="caption" x="500" y="401" text-anchor="end">“不 await Promise”不代表同步回调不会占用当前调用栈。</text>
  <text class="caption" x="500" y="548" text-anchor="middle">核心 AgentEvent、Session AgentSessionEvent 与扩展 ExtensionEvent 是不同联合类型，不是同一批事件的两个别名。</text>
</svg>
