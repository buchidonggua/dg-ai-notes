<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">AgentEvent 的生命周期事件组</title>
  <desc id="desc">Agent 生命周期包含多个 Turn；每个 Turn 中消息与工具执行是并列事件组。四个事件组共十种 AgentEvent。</desc>
  <defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1c1917}.title{font-size:20px;font-weight:700}.head{font-size:14px;font-weight:700}.body{font-size:12px}.small{font-size:11px}.trace{fill:#fff7f5;stroke:#b5523a;stroke-width:1.6}.turn{fill:#fafaf9;stroke:#57534e;stroke-width:1.4}.msg{fill:#eff6ff;stroke:#3973ac;stroke-width:1.2}.tool{fill:#f6fbf6;stroke:#2d6e3c;stroke-width:1.2}</style></defs>
  <rect width="960" height="560" fill="#fff"/><text class="title" x="480" y="32" text-anchor="middle">AgentEvent：生命周期事件组（共 10 种）</text>
  <rect class="trace" x="35" y="58" width="650" height="465" rx="18"/><text class="head" x="55" y="86">Agent / Trace</text><text class="small" x="665" y="86" text-anchor="end">agent_start → … → agent_end</text>
  <rect class="turn" x="65" y="112" width="590" height="245" rx="14"/><text class="head" x="85" y="139">Turn 1</text><text class="small" x="635" y="139" text-anchor="end">turn_start → turn_end</text>
  <rect class="msg" x="95" y="162" width="245" height="158" rx="10"/><text class="head" x="217" y="188" text-anchor="middle">Message 生命周期（3）</text><text class="body" x="217" y="223" text-anchor="middle">message_start</text><text class="body" x="217" y="250" text-anchor="middle">message_update × N</text><text class="body" x="217" y="277" text-anchor="middle">message_end</text><text class="small" x="217" y="303" text-anchor="middle">模型响应流</text>
  <rect class="tool" x="375" y="162" width="245" height="158" rx="10"/><text class="head" x="497" y="188" text-anchor="middle">Tool Execution 生命周期（3）</text><text class="body" x="497" y="223" text-anchor="middle">tool_execution_start</text><text class="body" x="497" y="250" text-anchor="middle">tool_execution_update × N</text><text class="body" x="497" y="277" text-anchor="middle">tool_execution_end</text><text class="small" x="497" y="303" text-anchor="middle">与 Message 同属一个 Turn</text>
  <rect class="turn" x="65" y="377" width="590" height="112" rx="14"/><text class="head" x="85" y="405">Turn 2</text><text class="small" x="635" y="405" text-anchor="end">turn_start → turn_end</text><rect class="msg" x="95" y="420" width="525" height="50" rx="8"/><text class="body" x="357" y="450" text-anchor="middle">Message：message_start → message_update × N → message_end（无工具调用）</text>
  <rect x="715" y="80" width="215" height="420" rx="12" fill="#fafaf9" stroke="#d6d3d1"/><text class="head" x="735" y="110">事件类型计数</text><text class="body" x="740" y="153">Agent 生命周期：2</text><text class="small" x="740" y="174">agent_start / agent_end</text><text class="body" x="740" y="218">Turn 生命周期：2</text><text class="small" x="740" y="239">turn_start / turn_end</text><text class="body" x="740" y="283">Message 生命周期：3</text><text class="small" x="740" y="304">start / update / end</text><text class="body" x="740" y="348">Tool 生命周期：3</text><text class="small" x="740" y="369">start / update / end</text><line x1="740" y1="400" x2="900" y2="400" stroke="#d6d3d1"/><text class="head" x="820" y="438" text-anchor="middle">2 + 2 + 3 + 3 = 10</text><text class="small" x="820" y="466" text-anchor="middle">Message 与 Tool 是同级事件组</text>
  <text class="small" x="480" y="545" text-anchor="middle" fill="#78716c">事件只描述生命周期顺序；是否执行工具取决于 AssistantMessage 的 toolCall 内容块。</text>
</svg>
